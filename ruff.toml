target-version = "py315"

[lint]
select = ["E4", "E7", "E9", "F", "B"]
# One-line statements are this repo's style for short guards and are not formatted away.
# B905 stays off: strict= would turn length mismatches into new failures instead of
# catching mistakes, so zip pairing is reviewed at each site instead.
ignore = ["E701", "E702", "B905"]
