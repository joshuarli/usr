name = "usr-memories"
compatibility_date = "2026-10-30"
main = "src/index.ts"
workers_dev = false
preview_urls = false

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "usr-memories"

[[d1_databases]]
binding = "DB"
database_name = "usr-memories"
database_id = "9870c4da-3758-4f0c-ab6d-2372eb34009b"

[[routes]]
pattern = "memories.17166969.xyz"
custom_domain = true

[vars]
ACCESS_TEAM_DOMAIN = "joshuarli.cloudflareaccess.com"
ACCESS_AUD = "5a104e8f635a9b4d424e56de441221c443d3293ddd26c751da7e2393713bdfa6"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 0.25

[observability.traces]
enabled = true
head_sampling_rate = 0.10

[exports.default]
type = "worker"

  [exports.default.cache]
  enabled = false
