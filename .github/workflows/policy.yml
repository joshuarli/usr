name: Check generated model policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  policy:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: laputa-systems/buildlib/setup@4ed2e0a1e0a5d23911ffccdd97349d30a7885f01 # v0.3.2
        with:
          tools: node
          lock: tools/sync/tools.lock.json
      - name: Check deterministic projections
        run: |
          make check-generated
          node --test tools/policy/generate.test.ts
      - name: Verify Devin provider preflight and conditional Pi launcher
        run: |
          node --experimental-strip-types --test tools/pi-subagent-bridge/test/devin-provider.test.ts
          python3 -I tools/pi/test_runtime_profiles.py
