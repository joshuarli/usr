name: Build Linux ARM64 Pi offline runtime
on:
  push:
    branches: [pi-offline-runtime]
    paths:
      - ".github/workflows/pi-offline-build-arm.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux_arm:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Build Linux ARM64 from vendored sources
        shell: bash
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"
          bash tools/pi/build-runtime.sh
      - name: Publish platform artifact to working branch
        shell: bash
        run: |
          git config user.name "usr-pi-vendor-bot"
          git config user.email "usr-pi-vendor-bot@users.noreply.github.com"
          git add -f vendor/pi/runtime
          git commit -m "Vendor Linux ARM64 Pi runtime archive [skip ci]"
          git pull --rebase origin pi-offline-runtime
          git push origin HEAD:pi-offline-runtime
