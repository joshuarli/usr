name: Verify Pi offline setup and bridge
on:
  push:
    branches: [main, pi-offline-runtime]
    paths:
      - "tools/sync/**"
      - "tools/pi/**"
      - "dotfiles/pi-test.py"
      - "dotfiles/doctor-test.sh"
      - "dotfiles/base/.pi/**"
      - ".github/workflows/pi-offline-verify.yml"
  workflow_dispatch:
concurrency:
  group: verify-pi-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.13.1'
      - name: Offline Pi package and sync acceptance
        shell: bash
        run: |
          set -euo pipefail
          printf '/.work/\n' >> .git/info/exclude
          mkdir -p .work/tmp
          TMPDIR="$PWD/.work/tmp" python3 -I tools/pi/test_release_install.py
          python3 -I tools/pi/test_offline.py
          python3 -I tools/pi/test_sync_bridge_offline.py
          python3 -I dotfiles/pi-test.py
          python3 -I tools/sync/test_pi_extensions.py
          python3 -I tools/sync/pi-worker-test.py
          python3 -I tools/sync/claude-worker-test.py
          python3 -I tools/sync/opencode-worker-test.py
          python3 -I tools/sync/test_main.py
          python3 -I tools/sync/test_installer.py
          node tools/skills/skills.ts check
          # The full repository suite expects no system PyYAML C extension; isolate it
          # from GitHub runner site-packages without installing any pip packages.
          python3 -m venv --without-pip .work/isolated-python
          PATH="$PWD/.work/isolated-python/bin:$PATH" \
            GIT_AUTHOR_NAME=CI GIT_AUTHOR_EMAIL=ci@example.invalid \
            GIT_COMMITTER_NAME=CI GIT_COMMITTER_EMAIL=ci@example.invalid sh sync check
