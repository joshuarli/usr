#:schema https://developers.openai.com/codex/config-schema.json

personality = "pragmatic"
model_verbosity = "low"
hide_agent_reasoning = true

approval_policy = "never"
sandbox_mode = "danger-full-access"
service_tier = "default"

[features]
goals = true
apps = false
plugins = false
remote_plugin = false

# Experimental, useful for long-running local tasks.
prevent_idle_sleep = true

[features.context_management]
experimental_mode = true

[agents]
enabled = true
max_concurrent_threads_per_session = 16

# Cost-safe GPT-6 fallback for every unspecified child.
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"

[features.multi_agent_v2]
# Expose per-spawn model and reasoning controls when V2 is active.
expose_spawn_agent_model_overrides = true

[analytics]
enabled = false

[feedback]
enabled = false

# Optional "full-send" experiment. Leave this off while the explicit
# orchestrate skill owns delegation; GPT-6 Astra/Sol ultra effort can also
# trigger automatic delegation.
#
# [features.code_mode]
# enabled = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "context-used", "fast-mode", "weekly-limit"]
status_line_use_colors = true

[tui.model_availability_nux]
gpt-6-astra = 4

[model_providers.openrouter]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"

[projects."/Users/josh/d/ferrisearch"]
trust_level = "trusted"

[projects."/Users/josh/d/extension-loupe"]
trust_level = "trusted"

[projects."/Users/josh/d/obsidian-webp-paste"]
trust_level = "trusted"

[projects."/Users/josh/usr"]
trust_level = "trusted"

[projects."/private/tmp"]
trust_level = "trusted"

