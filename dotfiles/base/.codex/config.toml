#:schema https://learn.chatgpt.com/docs/config-schema.json

hide_agent_reasoning = true

approval_policy = "never"
sandbox_mode = "danger-full-access"
service_tier = "default"
model = "gpt-6-luna"
model_reasoning_effort = "low"

[features]
goals = true
apps = false
plugins = false
remote_plugin = false

prevent_idle_sleep = true

[agents]
enabled = true
max_concurrent_threads_per_session = 32

# Nesting cap: root plus three levels of children. Every child is the same
# model, so depth is the only thing to bound. Honored by multi_agent (V1); V2
# ignores it, so do not enable multi_agent_v2 without another depth control.
max_depth = 3

# Default model and effort for every unspecified child.
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "xhigh"

[features.multi_agent_v2]
expose_spawn_agent_model_overrides = true

[analytics]
enabled = false

[feedback]
enabled = false

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_method = "bel"
notification_condition = "always"
status_line = ["model-with-reasoning", "current-dir", "context-used", "fast-mode", "weekly-limit"]
status_line_use_colors = true
screen_reader_detection_done = true

[tui.model_availability_nux]
gpt-6-astra = 4
"gpt-6.1-sol" = 4

[model_providers.openrouter]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"

[notice]
hide_rate_limit_model_nudge = true

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp"

