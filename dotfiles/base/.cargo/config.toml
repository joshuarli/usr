[build]
# Cargo runs the kache binary directly, relative to $HOME: a shell launcher
# drops environment names that are not shell identifiers, such as Cargo's
# CARGO_BIN_EXE_<bin> for a hyphenated binary, so integration tests could not
# compile. cc-rs reuses RUSTC_WRAPPER as the C compiler wrapper only for known
# cache names, so the file must be named kache. sync installs kache whenever
# rustup is present; a host without it sets CARGO_BUILD_RUSTC_WRAPPER=.
rustc-wrapper = ".cargo/bin/kache"

[env]
# kache init adds this key when it is missing. cc-rs reads it only when a
# compiler value is several words, so it does not affect the wrappers below.
CC_KNOWN_WRAPPER_CUSTOM = "kache"
HOST_CXX = "cargo-wrapper-cxx"
HOST_CC = "cargo-wrapper-cc"

# Link with the installed mold. /usr/local/libexec/mold/ld is a symlink to
# /usr/local/bin/mold, and -B makes the C compiler driver use it as `ld`.
# Alpine has no `cc`, so musl targets link through clang and its lld config.
[target.x86_64-unknown-linux-musl]
linker = "clang"
rustflags = ["-Clink-arg=-B/usr/local/libexec/mold"]

[target.aarch64-unknown-linux-musl]
linker = "clang"
rustflags = ["-Clink-arg=-B/usr/local/libexec/mold"]
