[build]
rustc-wrapper = "kache"

[env]
CC_KNOWN_WRAPPER_CUSTOM = "kache"
HOST_CXX = "kache clang++"
HOST_CC = "kache clang"

# Link with the installed mold. /usr/local/libexec/mold/ld is a symlink to
# /usr/local/bin/mold, and -B makes the C compiler driver use it as `ld`.
# Alpine has no `cc`, so musl targets link through clang and its lld config.
[target.x86_64-unknown-linux-musl]
linker = "clang"
rustflags = ["-Clink-arg=-B/usr/local/libexec/mold"]

[target.aarch64-unknown-linux-musl]
linker = "clang"
rustflags = ["-Clink-arg=-B/usr/local/libexec/mold"]

