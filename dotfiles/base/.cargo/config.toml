[build]
rustc-wrapper = "kache"
# Relative to $HOME. On a musl host the shim preloads jemalloc: musl's
# allocator puts most of a thin-LTO rustc build in the kernel.
rustc = ".local/libexec/jemalloc-rustc/rustc"

[env]
CC_KNOWN_WRAPPER_CUSTOM = "kache"
HOST_CXX = "kache c++"
HOST_CC = "kache cc"

# Link with the installed mold. /usr/local/libexec/mold/ld is a symlink to
# /usr/local/bin/mold, and -B makes the C compiler driver use it as `ld`.
[target.x86_64-unknown-linux-musl]
rustflags = ["-Clink-arg=-B/usr/local/libexec/mold"]

